[package]
name = "ollama-studio"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_commonmark = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
base64 = "0.22"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
directories = "6.0.0"

[build-dependencies]
winres = "0.1.12"

